name: Refresh and deploy retail prices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-pricing.yml'
      - 'scripts/pricing.ts'
      - 'scripts/retail-mappings.ts'
      - 'scripts/commercial-pricing.ts'
      - 'src/offerings.ts'
      - 'src/catalogue.ts'
      - 'tests/e2e/**'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-static-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run pricing:refresh
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Persist the validated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pricing
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated Azure retail catalogue'
            git push origin HEAD:main
          fi
      - name: Deploy the validated catalogue in this run
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check field guidance and verified pricing on the live Worker
        run: npm run test:e2e -- tests/e2e/field-help.spec.ts tests/e2e/retail-first.spec.ts
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
          STUDIO_TEST_URL: https://ai-econmics-studio.ethan0wens.workers.dev
