name: Refresh and publish Studio retail prices
on:
  schedule:
    - cron: '17 6 * * 0,2-6'
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: verified-pricing-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      review: ${{ steps.review.outcome }}
      refresh: ${{ steps.refresh.outcome }}
      regression: ${{ steps.regression.outcome }}
      changed: ${{ steps.candidate.outputs.changed }}
      pending: ${{ steps.pending.outputs.exists }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - name: Reconcile official Microsoft evidence
        id: review
        run: |
          if [[ "$STUDIO_SCHEDULE" == '17 6 * * 0,2-6' ]]; then
            npm run maintenance:review -- --daily
          else
            npm run maintenance:review
          fi
        env:
          STUDIO_SCHEDULE: ${{ github.event.schedule }}
      - name: Preserve reviewed evidence for diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-evidence-${{ github.run_attempt }}
          path: catalogue/maintenance.json
          retention-days: 7
      - name: Refresh and validate the Azure retail snapshot
        id: refresh
        run: |
          npm run pricing:refresh
          npx --no-install tsx scripts/pricing.ts coverage >> "$GITHUB_STEP_SUMMARY"
      - name: Identify material pricing and evidence changes
        id: candidate
        run: |
          npm run pricing:validate
          npm run evidence:validate
          npx --no-install tsx scripts/pricing-candidate.ts "$RUNNER_TEMP/pricing.patch"
      - name: Find a pending pricing pull request on a no-change run
        if: steps.candidate.outputs.changed == 'false'
        id: pending
        run: |
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=main \
            -f "head=${GITHUB_REPOSITORY_OWNER}:automation/verified-pricing" --jq 'length')
          if [[ "$count" != '0' ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup-browser
        if: steps.candidate.outputs.changed == 'true'
      - name: Validate the catalogue and reconcile financial and browser scenarios
        id: regression
        if: steps.candidate.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run test:e2e
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: verified-pricing-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing.patch
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' || needs.prepare.outputs.pending == 'true'
    environment: pricing-publisher
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.changed == 'true'
        with:
          name: verified-pricing-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-patch
      - name: Apply the allowlisted, validated patch to the checked base
        if: needs.prepare.outputs.changed == 'true'
        run: |
          npx --no-install tsx scripts/check-pricing-patch.ts "$RUNNER_TEMP/pricing-patch/pricing.patch"
          npm run pricing:validate
          npm run evidence:validate
      - name: Publish and squash-merge the pricing-only pull request after required checks
        run: |
          if [[ "$STUDIO_PRICING_CHANGED" == 'true' ]]; then
            npx --no-install tsx scripts/publish-pricing.ts
          else
            npx --no-install tsx scripts/publish-pricing.ts --no-change
          fi
        env:
          STUDIO_PRICING_CHANGED: ${{ needs.prepare.outputs.changed }}
          STUDIO_PRICING_APP_ID: ${{ vars.STUDIO_PRICING_APP_ID }}
          STUDIO_PRICING_APP_PRIVATE_KEY: ${{ secrets.STUDIO_PRICING_APP_PRIVATE_KEY }}

  notify:
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    needs: [prepare, publish]
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - id: evidence
        if: needs.prepare.outputs.review == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: reviewed-evidence-${{ github.run_attempt }}
          path: catalogue
      - name: Reconcile exception issues
        if: always()
        run: npx --no-install tsx scripts/maintenance-notify.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STUDIO_REVIEW_OUTCOME: ${{ needs.prepare.outputs.review == 'success' && steps.evidence.outcome != 'success' && 'failure' || needs.prepare.outputs.review }}
          STUDIO_REFRESH_OUTCOME: ${{ needs.prepare.outputs.refresh }}
          STUDIO_REGRESSION_OUTCOME: ${{ needs.prepare.outputs.regression }}
          STUDIO_PREPARE_OUTCOME: ${{ needs.prepare.result }}
          STUDIO_PUBLISH_OUTCOME: ${{ needs.publish.result }}
