name: Discover Microsoft retail meter candidates
on:
  push:
    branches: [work]
    paths: ['scripts/discover-retail.ts', 'scripts/survey-retail.ts', '.github/workflows/pricing-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: [focused]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/survey-retail.ts "$STUDIO_SURVEY_SOURCE"
        env:
          STUDIO_SURVEY_SOURCE: ${{ matrix.source }}
