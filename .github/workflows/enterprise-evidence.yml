name: Review Microsoft enterprise evidence
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'scripts/survey-enterprise.ts'
      - 'scripts/survey-catalogue.ts'
      - 'scripts/*maintenance*.ts'
      - 'scripts/microsoft-*.ts'
      - '.github/workflows/enterprise-evidence.yml'
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      matrix:
        scope: [licensing, technical, matrix, region]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/survey-enterprise.ts "$STUDIO_SURVEY_SCOPE"
        env:
          STUDIO_SURVEY_SCOPE: ${{ matrix.scope }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-evidence-${{ matrix.scope }}
          path: enterprise-*.txt
          retention-days: 7
  catalogue-accuracy:
    strategy:
      matrix:
        scope: [business, security, securityoffers, throughput, sizing, models, grid, sizingvalues, meters]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/survey-catalogue.ts "$STUDIO_SURVEY_SCOPE"
        env:
          STUDIO_SURVEY_SCOPE: ${{ matrix.scope }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalogue-accuracy-${{ matrix.scope }}
          path: enterprise-accuracy-*.txt
          retention-days: 7
  live-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/setup-browser
      - name: Check the Studio on its Custom Domain
        run: |
          if ! npm run test:e2e -- tests/e2e/enterprise.spec.ts tests/e2e/field-help.spec.ts tests/e2e/retail-first.spec.ts > "$RUNNER_TEMP/live-check.log" 2>&1; then
            cat "$RUNNER_TEMP/live-check.log"
            tail -c 5800 "$RUNNER_TEMP/live-check.log" | jq -Rsr 'gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' | sed 's/^/::error title=Public Worker browser checks::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/live-check.log"
        env:
          STUDIO_TEST_URL: https://studio.ethan0wens.tech
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
  reconcile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run maintenance:review
      - run: npm run pricing:refresh
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - uses: ./.github/actions/setup-browser
      - run: npm run test:e2e
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: catalogue-maintenance-preview
          path: |
            catalogue/maintenance.json
            public/pricing/manifest.json
          retention-days: 7
