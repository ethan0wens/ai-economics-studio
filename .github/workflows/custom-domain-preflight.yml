name: Observe the Studio custom domain

on:
  workflow_dispatch:
    inputs:
      application:
        description: Full Git revision from the verified live release
        required: true
        type: string
      catalogue:
        description: SHA-256 of the verified live catalogue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: custom-domain-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STUDIO_EXPECTED_APPLICATION: ${{ inputs.application }}
      STUDIO_EXPECTED_CATALOGUE_ID: ${{ inputs.catalogue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Observe public DNS, TLS and edge responses without credentials
        run: |
          node --input-type=module <<'JS'
          import { Resolver } from 'node:dns/promises';
          import { appendFile } from 'node:fs/promises';
          import { connect } from 'node:tls';

          const host = 'studio.ethan0wens.tech';
          const dns = new Resolver({ timeout: 4000, tries: 2 });
          const observed = async (label, check) => {
            let result;
            try { result = await check(); } catch (error) {
              result = [error.code, error.message, error.cause?.message].filter(Boolean).join(' · ');
            }
            return `${label} · ${result}`;
          };
          const records = [
            ['ethan0wens.tech', 'NS'], [host, 'A'], [host, 'AAAA'], [host, 'CNAME'],
          ].map(([name, type]) => observed(`${name} ${type}`, async () => (await dns.resolve(name, type)).join(', ')));
          const tls = observed('TLS certificate', () => new Promise((resolve, reject) => {
            const socket = connect({ host, servername: host, port: 443, rejectUnauthorized: true });
            socket.once('error', reject);
            socket.setTimeout(10_000, () => socket.destroy(new Error('TLS probe timed out')));
            socket.once('secureConnect', () => {
              const peer = socket.getPeerCertificate();
              resolve(`${socket.getProtocol()} · ${peer.subjectaltname} · issuer ${peer.issuer?.CN} · valid ${peer.valid_from} to ${peer.valid_to}`);
              socket.end();
            });
          }));
          const urls = [
            `https://${host}/`, `http://${host}/`, `http://${host}/documentation?studio_transport_probe=1`,
          ].map(url => observed(url, async () => {
            const response = await fetch(url, { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(12_000) });
            await response.body?.cancel();
            const headers = ['location', 'server', 'cf-ray', 'strict-transport-security', 'cache-control'].flatMap(name => {
              const value = response.headers.get(name);
              return value ? [`${name}=${value}`] : [];
            });
            return [`HTTP ${response.status}`, ...headers].join(' · ');
          }));
          const lines = await Promise.all([...records, tls, ...urls]);
          for (const line of lines) {
            console.log('::notice title=Studio domain observation::' + line.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          }
          await appendFile(process.env.GITHUB_STEP_SUMMARY, '## Studio domain observations\n\n' + lines.map(line => '- ' + line).join('\n') + '\n');
          JS
      - run: npm ci --ignore-scripts
      - name: Verify strict transport, published receipt and catalogue
        run: npm run security:production -- "$STUDIO_EXPECTED_APPLICATION" "$STUDIO_EXPECTED_CATALOGUE_ID"
      - uses: ./.github/actions/setup-browser
      - name: Verify the Studio in Chromium on the custom domain
        run: |
          if ! npm run test:e2e > "$RUNNER_TEMP/studio-custom-domain-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/studio-custom-domain-browser.log"
            tail -c 12000 "$RUNNER_TEMP/studio-custom-domain-browser.log" | jq -Rs -r 'gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' | sed 's/^/::error title=Custom domain browser checks::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/studio-custom-domain-browser.log"
          tail -n 18 "$RUNNER_TEMP/studio-custom-domain-browser.log" >> "$GITHUB_STEP_SUMMARY"
        env:
          STUDIO_TEST_URL: https://studio.ethan0wens.tech
          STUDIO_CHECK_RELEASE_HEALTH: '1'
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
