name: Verify Azure retail feed before release
on:
  push:
    branches: [work, 'release/**']
    paths:
      - 'README.md'
      - 'scripts/docs.ts'
      - 'tests/pricing-publication*.test.ts'
      - '.github/workflows/pricing-preview.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/enterprise-evidence.yml'
      - '.github/workflows/refresh-pricing.yml'
      - 'scripts/pricing.ts'
      - 'scripts/pricing-candidate.ts'
      - 'scripts/publish-pricing.ts'
      - 'scripts/check-pricing-patch.ts'
      - 'scripts/production-recovery.ts'
      - 'scripts/discovery.ts'
      - 'catalogue/**'
      - 'src/coverage.ts'
      - 'scripts/deploy.ts'
      - 'scripts/worker-release.ts'
      - 'wrangler.jsonc'
      - 'scripts/retail-mappings.ts'
      - 'scripts/commercial-pricing.ts'
      - 'src/offerings.ts'
      - 'src/catalogue.ts'
      - 'public/pricing/**'
      - 'tests/e2e/**'
      - 'package-lock.json'
      - 'scripts/security-*.ts'
      - 'scripts/release-readiness.ts'
      - 'docs/security/public-release.json'
      - 'package.json'
      - 'src/untrusted-data.ts'
      - 'public/_headers'

permissions:
  contents: read

concurrency:
  group: pricing-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - name: Validate the live Azure response
        run: |
          if ! result=$(npm run --silent pricing:refresh 2>&1); then
            result=${result//%/%25}
            result=${result//$'\r'/%0D}
            result=${result//$'\n'/%0A}
            printf '::error title=Azure retail refresh rejected::%s\n' "$result"
            exit 1
          fi
          npm run pricing:validate
      - name: Report verified preview catalogue
        run: |
          printf '### Read-only Azure retail preview\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Validated records: \(.records)\n\nChecked at: \(.lastCheckedAt)\n\nCatalogue ID: \(.catalogueId)"' public/pricing/manifest.json >> "$GITHUB_STEP_SUMMARY"
          npx --no-install tsx scripts/pricing.ts coverage >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-retail-preview
          path: public/pricing/*.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - uses: ./.github/actions/setup-browser
      - name: Check browser pricing and field guidance
        run: |
          if ! npm run test:e2e > "$RUNNER_TEMP/studio-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/studio-browser.log"
            tail -c 12000 "$RUNNER_TEMP/studio-browser.log" | jq -Rs 'gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' -r | sed 's/^/::error title=Browser pricing checks::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/studio-browser.log"
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-preview-${{ github.run_attempt }}
          path: |
            catalogue/
            public/pricing/
            dist/
          if-no-files-found: error
          retention-days: 2

  staged-security:
    needs: verify-feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Clear the checkout's pricing snapshot before loading the staged snapshot
        run: node -e "require('node:fs').rmSync('public/pricing', { recursive:true })"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-preview-${{ github.run_attempt }}
          path: .
      - run: npm run pricing:validate && npm run evidence:validate && npm run security:build

  public-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Observe current custom-domain delivery
        run: npm run security:production -- --observe-current
      - name: Recheck both retired preview protocols
        run: npm run security:production -- --verify-legacy-retired
      - uses: ./.github/actions/setup-browser
        if: startsWith(github.ref, 'refs/heads/release/')
      - name: Reconcile the current live release in Chromium
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          export STUDIO_EXPECTED_CATALOGUE_ID="$(jq -r .catalogueId public/pricing/manifest.json)"
          npm run test:e2e
        env:
          STUDIO_TEST_URL: https://studio.ethan0wens.tech
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
          STUDIO_CHECK_RELEASE_HEALTH: '1'

  publisher-rehearsal:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and stage genuine current Microsoft evidence without publishing
        run: |
          npm run maintenance:review -- --daily
          npm run pricing:refresh
          npm run pricing:validate
          npm run evidence:validate
          npx --no-install tsx scripts/pricing-candidate.ts "$RUNNER_TEMP/pricing.patch"
