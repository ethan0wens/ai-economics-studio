name: Refresh and deploy retail prices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-pricing.yml'
      - 'scripts/pricing.ts'
      - 'scripts/discovery.ts'
      - 'scripts/*maintenance*.ts'
      - 'scripts/microsoft-*.ts'
      - 'catalogue/**'
      - 'src/coverage.ts'
      - 'scripts/retail-mappings.ts'
      - 'scripts/commercial-pricing.ts'
      - 'src/offerings.ts'
      - 'src/catalogue.ts'
      - 'tests/e2e/**'
  schedule:
    - cron: '17 6 * * 0,2-6'
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: production-static-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reconcile official Microsoft evidence
        id: review
        run: |
          if [[ "$STUDIO_SCHEDULE" == '17 6 * * 0,2-6' ]]; then
            npm run maintenance:review -- --daily
          else
            npm run maintenance:review
          fi
        env:
          STUDIO_SCHEDULE: ${{ github.event.schedule }}
      - name: Refresh and validate the Azure retail snapshot
        id: refresh
        run: |
          npm run pricing:refresh
          npx tsx scripts/pricing.ts coverage >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-browser
      - name: Validate the catalogue and reconcile financial and browser scenarios
        id: regression
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run test:e2e
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
      - name: Deploy, verify and publish the staged catalogue
        id: deploy
        run: npm run deploy -- --publish-catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Reconcile exception issues
        if: always()
        run: npx tsx scripts/maintenance-notify.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STUDIO_REVIEW_OUTCOME: ${{ steps.review.outcome }}
          STUDIO_REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          STUDIO_REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          STUDIO_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
