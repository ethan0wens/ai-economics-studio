name: Verify Azure retail feed before release
on:
  push:
    branches: [work, 'release/**']
    paths:
      - 'README.md'
      - 'scripts/docs.ts'
      - 'tests/pricing-publication*.test.ts'
      - '.github/workflows/pricing-preview.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/enterprise-evidence.yml'
      - '.github/workflows/refresh-pricing.yml'
      - 'scripts/pricing.ts'
      - 'scripts/pricing-candidate.ts'
      - 'scripts/publish-pricing.ts'
      - 'scripts/check-pricing-patch.ts'
      - 'scripts/production-recovery.ts'
      - 'scripts/discovery.ts'
      - 'catalogue/**'
      - 'src/coverage.ts'
      - 'scripts/deploy.ts'
      - 'scripts/worker-release.ts'
      - 'wrangler.jsonc'
      - 'scripts/retail-mappings.ts'
      - 'scripts/commercial-pricing.ts'
      - 'src/offerings.ts'
      - 'src/catalogue.ts'
      - 'public/pricing/**'
      - 'tests/e2e/**'
      - 'package-lock.json'
      - 'scripts/security-*.ts'
      - 'scripts/release-readiness.ts'
      - 'docs/security/public-release.json'
      - 'package.json'
      - 'src/untrusted-data.ts'
      - 'public/_headers'

permissions:
  contents: read

concurrency:
  group: pricing-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - name: Validate the live Azure response
        run: |
          if ! result=$(npm run --silent pricing:refresh 2>&1); then
            result=${result//%/%25}
            result=${result//$'\r'/%0D}
            result=${result//$'\n'/%0A}
            printf '::error title=Azure retail refresh rejected::%s\n' "$result"
            exit 1
          fi
          npm run pricing:validate
      - name: Report verified preview catalogue
        run: |
          printf '### Read-only Azure retail preview\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Validated records: \(.records)\n\nChecked at: \(.lastCheckedAt)\n\nCatalogue ID: \(.catalogueId)"' public/pricing/manifest.json >> "$GITHUB_STEP_SUMMARY"
          npx --no-install tsx scripts/pricing.ts coverage >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-retail-preview
          path: public/pricing/*.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - uses: ./.github/actions/setup-browser
      - name: Check browser pricing and field guidance
        run: |
          if ! npm run test:e2e > "$RUNNER_TEMP/studio-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/studio-browser.log"
            tail -c 12000 "$RUNNER_TEMP/studio-browser.log" | jq -Rs 'gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' -r | sed 's/^/::error title=Browser pricing checks::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/studio-browser.log"
        env:
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-preview-${{ github.run_attempt }}
          path: |
            catalogue/
            public/pricing/
            dist/
          if-no-files-found: error
          retention-days: 2

  staged-security:
    needs: verify-feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Clear the checkout's pricing snapshot before loading the staged snapshot
        run: node -e "require('node:fs').rmSync('public/pricing', { recursive:true })"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-preview-${{ github.run_attempt }}
          path: .
      - run: npm run pricing:validate && npm run evidence:validate && npm run security:build

  public-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture the incident asset response outside the workspace proxy
        if: github.ref == 'refs/heads/release/fix-production-mime'
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const origin = 'https://studio.ethan0wens.tech';
          const modes = [
            ['identity', { cache: 'no-store', headers: { 'Accept-Encoding': 'identity', 'Cache-Control': 'no-cache' } }],
            ['public', { cache: 'no-cache' }],
            ['cors', { headers: { 'Sec-Fetch-Mode': 'cors', 'Accept': '*/*' } }],
            ['navigate', { headers: { 'Sec-Fetch-Mode': 'navigate', 'Accept': 'text/html' } }],
          ];
          const digest = bytes => createHash('sha256').update(bytes).digest('hex').slice(0, 16);
          const get = (path, options) => fetch(origin + path, { ...options, redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(10_000) });
          const base = await get('/', modes[0][1]);
          const shell = await base.text();
          const built = /<script[^>]*src="([^"]+)"/.exec(shell)?.[1];
          const release = (await (await get('/pricing/health.json', modes[0][1])).json()).release;
          console.log('::notice title=Asset incident baseline::' + JSON.stringify({ application: release.application, shell: digest(shell), publishedScript: built }));
          const paths = [...new Set(['/assets/index-C0cT9zG4.js', built].filter(Boolean))];
          await Promise.all(paths.flatMap(path => modes.map(async ([rule, options]) => {
            const response = await get(path, options);
            const bytes = Buffer.from(await response.arrayBuffer());
            const headers = Object.fromEntries(['content-type', 'content-encoding', 'cache-control', 'cf-cache-status', 'cf-ray', 'age', 'etag', 'vary'].map(name => [name, response.headers.get(name)]));
            console.log('::notice title=Asset incident response::' + JSON.stringify({ path, rule, status: response.status, sha: digest(bytes), shell: bytes.equals(Buffer.from(shell)), headers }));
          })));
          JS
      - name: Observe current custom-domain delivery
        run: npm run security:production -- --observe-current
      - name: Recheck both retired preview protocols
        run: npm run security:production -- --verify-legacy-retired
      - uses: ./.github/actions/setup-browser
        if: startsWith(github.ref, 'refs/heads/release/')
      - name: Reconcile the current live release in Chromium
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          export STUDIO_EXPECTED_CATALOGUE_ID="$(jq -r .catalogueId public/pricing/manifest.json)"
          npm run test:e2e
        env:
          STUDIO_TEST_URL: https://studio.ethan0wens.tech
          STUDIO_CHECK_PUBLISHED_CATALOGUE: '1'
          STUDIO_CHECK_RELEASE_HEALTH: '1'

  publisher-rehearsal:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and stage genuine current Microsoft evidence without publishing
        run: |
          npm run maintenance:review -- --daily
          npm run pricing:refresh
          npm run pricing:validate
          npm run evidence:validate
          npx --no-install tsx scripts/pricing-candidate.ts "$RUNNER_TEMP/pricing.patch"

  incident-log:
    if: github.ref == 'refs/heads/release/fix-production-mime'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Read previous production job and report its recorded delivery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 44750515897 --repo ethan0wens/ai-economics-studio --job 136336918443 --log > "$RUNNER_TEMP/incident.log"
          python - "$RUNNER_TEMP/incident.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text()
          print(f"::notice title=Incident log review::Read the complete production job log ({len(log.splitlines())} lines).")
          evidence = [
              r"Current Version ID: [a-f0-9-]{36}",
              r"Found \d+ new or modified static assets",
              r"Uploaded ai-econmics-studio \([\d.]+ sec\)",
              r"Deployed ai-econmics-studio triggers \([\d.]+ sec\)",
              r"Unexpected asset MIME type for /assets/index-C0cT9zG4\.js\.",
              r"Application and pricing assets match the (?:candidate|rollback target) at https://studio\.ethan0wens\.tech",
              r"rollback target [a-f0-9-]{36}",
          ]
          for pattern in evidence:
              for found in sorted(set(re.findall(pattern, log, re.I))):
                  print("::notice title=Incident log recorded::" + found)
          relevant = [line for line in log.splitlines() if 'index-C0cT9zG4.js' in line and 'MIME' in line]
          if not any(re.search(r'content-type[=:]|cf-ray[=:]|HTTP [1-5][0-9]{2}', line, re.I) for line in relevant):
              print("::notice title=Incident log limits::The MIME failure lines give no response Content-Type, CF-Ray or exact HTTP status.")
          PY

  open-fix-pr:
    if: github.ref == 'refs/heads/release/fix-production-mime'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request the protected main PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if result=$(gh api --method POST repos/ethan0wens/ai-economics-studio/pulls \
            -f title='Fix immutable SPA fallbacks and verify the pricing App' \
            -f head='release/fix-production-mime' -f base='main' \
            -f body='Fixes the cached HTML bundle failure and adds scoped pricing App verification. Await owner confirmation after the required checks before any merge.' \
            --jq .html_url 2>&1); then
            printf '::notice title=Protected fix PR::%s\n' "$result"
          else
            status=$(printf '%s' "$result" | sed -nE 's/.*HTTP ([0-9]{3}).*/\1/p' | head -1)
            if [[ "$result" == *'not permitted to create or approve pull requests'* ]]; then
              printf '::notice title=Protected fix PR::Repository Actions settings denied PR creation (HTTP %s).\n' "${status:-unknown}"
            else
              printf '::notice title=Protected fix PR::GitHub rejected this workflow PR request (HTTP %s).\n' "${status:-unknown}"
            fi
          fi
