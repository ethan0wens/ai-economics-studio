name: Deploy static Studio to the custom domain
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/security/public-release.json'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-static-assets
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.recovery.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'schedule'
        with:
          node-version: '24'
      - if: github.event_name == 'schedule'
        run: npm ci --ignore-scripts
      - id: recovery
        if: github.event_name == 'schedule'
        run: npx --no-install tsx scripts/production-recovery.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || needs.plan.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - uses: ./.github/actions/setup-browser
      - run: npm run test:e2e
      - name: Deploy and verify the exact main revision
        run: |
          if ! npm run deploy; then
            printf '## Production remains unverified\n\nMain %s was not confirmed live. Inspect the guarded promotion and rollback logs. The scheduled production check retries a recoverable mismatch from the latest main.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
