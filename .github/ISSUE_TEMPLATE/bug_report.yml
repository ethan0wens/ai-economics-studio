name: Report a Studio issue
description: Describe a reproducible application problem using fictional data.
body:
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Describe the steps, expected behaviour and actual result. Use a fictional environment if an example helps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Browser and application revision
      description: Find the published application revision under Pricing Catalogue and Catalogue health.
  - type: markdown
    attributes:
      value: Please omit confidential environments, contractual prices and credentials. Report vulnerabilities privately using SECURITY.md.
